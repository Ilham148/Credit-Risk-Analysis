steps:
    # 1. Check out your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the Python environment on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Match this to your project's version

      # 3. INSTALL YOUR DEPENDENCIES (The Missing Step!)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # If you have a requirements file, uncomment the line below:
          # pip install -r requirements.txt 

      # 4. Now run your tests (This will work now!)
      - name: Run tests with pytest
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing